        // --- Router & View Rendering ---

        function router(route) {
            const app = document.getElementById('app-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('mobile-menu').classList.add('hidden');

            // Update nav active state
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('text-chuxiong-red');
                link.classList.add('text-gray-600');
            });
            document.querySelectorAll(`.nav-link`).forEach(link => {
                if (link.textContent.includes(getRouteName(route))) {
                    link.classList.remove('text-gray-600');
                    link.classList.add('text-chuxiong-red');
                }
            });

            switch(route) {
                case 'home': app.innerHTML = renderHome(); break;
                case 'resources': app.innerHTML = renderResources(); initResourceFilter(); break;
                case 'local': app.innerHTML = renderLocal(); initGallery(); break;
                case 'teachers': app.innerHTML = renderTeachers(); initTeacherTabs(); break;
                case 'students': app.innerHTML = renderStudents(); break;
                case 'calendar': app.innerHTML = renderCalendar(); break;
                default: app.innerHTML = renderHome();
            }
        }

        function getRouteName(route) {
            const names = {
                'home': '首页', 'resources': '美育资源馆', 'local': '乡土美育',
                'teachers': '教师备课', 'students': '学生创作', 'calendar': '活动日历'
            };

        function closeModal() {

        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function performSearch() {
            const query = document.getElementById('global-search').value.trim();
            if (query) {
                alert(`搜索功能：查找"${query}"\n\n（演示模式，实际将跳转至搜索结果页）`);
            }
        }

        function quickSearch(term) {
            const input = document.getElementById('global-search');
            if (input) {
                input.value = term;
                performSearch();
            }
        }

        // Back to Top Button
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('back-to-top');
            if (window.scrollY > 300) {
                btn.classList.remove('opacity-0', 'pointer-events-none');
                btn.classList.add('opacity-100');
            } else {
                btn.classList.add('opacity-0', 'pointer-events-none');
                btn.classList.remove('opacity-100');
            }
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            router('home');
        });
